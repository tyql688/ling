name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        # The production Web graph exceeds the hosted runner's default ~2 GiB heap.
        # Match release builds while keeping memory available for the other processes.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm verify

		<style>
			html,
			body,
			#root {
				height: 100%;
				margin: 0;
			}
			/* theme-init.js pre-paints the active skin's tokens inline on <html>, so var() here
			   keeps the startup frame skin-correct; literals remain as the no-skin fallback. */
			body {
				background: var(--color-surface, #ffffff);
				color: var(--color-text-primary, #1a1a1d);
				/* Unlayered, so it must defer to the skin token or it would beat index.css's
				   @layer base var(--font-sans) forever. */
				font-family: var(
					--font-sans,
					ui-sans-serif,
					system-ui,
					sans-serif,
					"Apple Color Emoji",
					"Segoe UI Emoji",
					"Segoe UI Symbol",
					"Noto Color Emoji"
				);
				overflow: hidden;
			}
			.dark body {
				background: var(--color-surface, #19191c);
				color: var(--color-text-primary, #f5f5f7);
			}
			/* Glass material (mac vibrancy / win acrylic): theme-init.js attaches .vibrancy to <html> before the first frame.
			   This bootstrap style is unlayered and beats the same-named @layer base rules in index.css, so the
			   transparent body must also live here for the OS material to show through (placed after .dark body to take effect in dark mode). */
			.vibrancy body {
				background: transparent;
			}

				opacity: 1;
				visibility: visible;
				transition:
					opacity 180ms ease,
					visibility 180ms ease;
			}

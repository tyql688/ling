packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  "@google/genai": true
  esbuild: true
  node-pty: true
  node-mac-permissions: true
  protobufjs: true
  "@parcel/watcher": false # prebuilt win32/darwin/linux binaries ship as optionalDeps; install script is source-build fallback only
  electron-winstaller: false # packaging-time only; build script never ran under pnpm 10 either
  tree-sitter-bash: false # permission parsing uses the shipped WASM grammar, not the native Node binding
  koffi: false # native voice uses the shipped platform package; the install script is a source-build fallback
minimumReleaseAgeExclude:
  - "@earendil-works/pi-voice@0.1.0"
  - "@earendil-works/chord@0.99.2"
  - "@earendil-works/pi-agent-core@0.99.2"
  - "@earendil-works/pi-ai@0.99.2"
  - "@earendil-works/pi-coding-agent@0.99.2"
  - "@earendil-works/pi-codemode@0.99.2"
  - "@earendil-works/pi-mcp@0.99.2"
  - "@earendil-works/pi-telemetry@0.99.2"
  - "@earendil-works/pi-tui@0.99.2"
  - "@gotgenes/pi-permission-system@36.2.1"
  - "@juicesharp/rpiv-todo@2.12.0"
  - "@juicesharp/rpiv-config@2.12.0"
overrides:
  "ansi-to-react>linkify-it": 5.0.2
  "minimatch@3.1.5>brace-expansion": 1.1.18
patchedDependencies:
  # Backport upstream CSS zoom positioning for Web menus: floating-ui/floating-ui#3492.
  "@floating-ui/core@1.8.0": patches/@floating-ui__core@1.8.0.patch
  "@floating-ui/dom@1.8.0": patches/@floating-ui__dom@1.8.0.patch
  # Expose the staged NSIS copy hook without replacing the signed installer/update workflow.
  app-builder-lib@26.17.0: patches/app-builder-lib@26.17.0.patch
  # Keep diagram rendering stable and yield Markdown batches without per-node layout reads.
  markstream-react@2.0.13: patches/markstream-react@2.0.13.patch
peerDependencyRules:
  allowedVersions:
    # ESLint's official compatibility adapter wraps these exact plugin versions in eslint.config.js.
    "eslint-plugin-react@7.37.5>eslint": "10"
    "eslint-plugin-jsx-a11y@6.10.2>eslint": "10"
